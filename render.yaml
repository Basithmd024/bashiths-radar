services:
  - type: web
    name: evolution-api
    runtime: image
    image:
      url: evoapicloud/evolution-api:latest
    plan: free
    region: oregon
    envVars:
      - key: SERVER_TYPE
        value: http
      - key: SERVER_PORT
        value: "10000"
      - key: PORT
        value: "10000"
      - key: SERVER_URL
        value: https://evolution-api-t9p5.onrender.com
      - key: CORS_ORIGIN
        value: "*"
      - key: CORS_METHODS
        value: "GET,POST,PUT,DELETE"
      - key: AUTHENTICATION_API_KEY
        value: Zi3VxfR/Tt/CIsobQ4jZnIz2t35CIBFIlZppDyHsW8s=
      - key: AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES
        value: "true"
      - key: CACHE_REDIS_ENABLED
        value: "false"
      - key: CACHE_LOCAL_ENABLED
        value: "true"
      - key: DATABASE_PROVIDER
        value: postgresql
      - key: DATABASE_CONNECTION_URI
        fromDatabase:
          name: evolution-db
          property: connectionString

databases:
  - name: evolution-db
    plan: free
    region: oregon
